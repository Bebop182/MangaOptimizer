[project]
name = "manga-optimizer"
version = "0.1.0"
description = "Optimize manga files for e-readers"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Bebop182" },
]
requires-python = ">=3.13"
dependencies = [
    "EbookLib==0.20",
    "lxml==6.1.3",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "six==1.17.0"
]

[project.scripts]
manga-optimizer = "manga_optimizer.cli:main"

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16",
    
]
test = [
    "pytest", 
    "pytest-cov"
]

[tool.setuptools.packages.find]
where = ["src"]
