[project]
name = "manga-optimizer"
version = "0.1.2"
description = "Optimize manga files for e-readers"
readme = "README.md"
license-files = ["LICENSE"]
authors = [
    { name = "Bebop182" },
]
requires-python = ">=3.10"
dependencies = [
    "EbookLib==0.20",
    "lxml==6.1.3",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "six==1.17.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.16",
    
]
test = [
    "pytest", 
    "pytest-cov"
]

[project.scripts]
manga-optimizer = "manga_optimizer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"manga_optimizer" = ["export/page_template.xhtml"]
